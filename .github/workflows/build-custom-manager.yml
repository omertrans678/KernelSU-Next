name: Build Custom KernelSU Manager

on:
  push:
    branches: [ build-manager-omerceren ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android NDK
        run: |
          echo "y" | /cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865" || true

      - name: Download ksud binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          mkdir -p app/src/main/jniLibs/riscv64
          curl -sSL -o app/src/main/jniLibs/arm64-v8a/libksud.so https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-aarch64-linux-android
          curl -sSL -o app/src/main/jniLibs/x86_64/libksud.so https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-x86_64-linux-android
          curl -sSL -o app/src/main/jniLibs/riscv64/libksud.so https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-riscv64-linux-android
          chmod +x app/src/main/jniLibs/*/libksud.so
          ls -la app/src/main/jniLibs/*

      - name: Generate release keystore and config
        run: |
          keytool -genkeypair -v             -keystore manager.jks             -alias ksunext             -keyalg RSA             -keysize 2048             -validity 10000             -storepass 123456             -keypass 123456             -dname "CN=KernelSU, OU=KernelSU, O=KernelSU, L=Unknown, ST=Unknown, C=CH"
          {
            echo "KEYSTORE_PASSWORD=123456"
            echo "KEY_ALIAS=ksunext"
            echo "KEY_PASSWORD=123456"
            echo "KEYSTORE_FILE=manager.jks"
            echo "android.builder.sdkDownload=true"
          } >> gradle.properties

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Manager-com.omerceren.managerks
          path: manager/app/build/outputs/apk/release/*.apk
